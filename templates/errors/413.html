{% extends "base.html" %}
{% block title %}File Too Large{% endblock %}
{% block content %}
<div class="text-center py-5">
    <i class="bi bi-file-earmark-x display-1 text-danger"></i>
    <h2 class="mt-3">File Too Large</h2>
    <p class="text-muted">The uploaded file exceeds the 50 MB size limit.</p>
    <a href="{{ url_for('reconciliation.upload') }}" class="btn btn-primary">Try Again</a>
</div>
{% endblock %}
